name: Build TrollRecorder CLI (rootless)

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  FINALPACKAGE: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:
  build-rootless:
    runs-on: macos-14

    steps:
      - name: Checkout TrollRecorder CLI sources
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid-procursus make

      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos
          submodules: recursive

      - name: Configure Theos and iOS SDK
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          ln -s "$THEOS" "$HOME/theos"
          cd "$THEOS"
          ./bin/install-sdk iPhoneOS16.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Build rootless Debian package
        run: |
          source devkit/rootless.sh
          FINALPACKAGE=1 gmake clean package

      - name: Upload rootless package
        uses: actions/upload-artifact@v4
        with:
          name: audio-commands-rootless
          path: packages/*.deb
          if-no-files-found: error
